[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  functions = "netlify/functions"

# Optional: redirect API paths to functions style you prefer
[[redirects]]
  from = "/api/pnx/session"
  to = "/.netlify/functions/pnx-session"
  status = 200

[[redirects]]
  from = "/api/pnx/charge"
  to = "/.netlify/functions/pnx-charge"
  status = 200
